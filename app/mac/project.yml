name: Towertail
options:
  bundleIdPrefix: com.towertail
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  xcodeVersion: "15.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ARCHS: "arm64 x86_64"
    ONLY_ACTIVE_ARCH: YES
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    SWIFT_STRICT_CONCURRENCY: complete
    SYMROOT: $(SRCROOT)/build
    OBJROOT: $(SRCROOT)/build/Intermediates
    CONFIGURATION_BUILD_DIR: $(SRCROOT)/build/$(CONFIGURATION)

targets:
  Towertail:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources
        excludes:
          - "**/*.md"
    resources:
      - Sources/Design/Assets.xcassets
    preBuildScripts:
      - name: "Bundle samplers"
        basedOnDependencyAnalysis: false
        script: |
          set -e
          SRC="${SRCROOT}/../../dist/samplers"
          DEST="${BUILT_PRODUCTS_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/samplers"
          if [ -d "$SRC" ]; then
            mkdir -p "$DEST"
            /usr/bin/rsync -a --delete "$SRC/" "$DEST/"
          fi
    info:
      path: Sources/App/Info.plist
      properties:
        LSUIElement: true
        LSMinimumSystemVersion: "14.0"
        CFBundleName: Towertail
        CFBundleDisplayName: Towertail
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundlePackageType: APPL
        NSHumanReadableCopyright: "© 2026 Towertail"
        NSHighResolutionCapable: true
    entitlements:
      path: Sources/App/Towertail.entitlements
      properties:
        com.apple.security.network.client: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.towertail.Towertail
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Sources/App/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/App/Towertail.entitlements
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  TowertailTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Tests
    dependencies:
      - target: Towertail
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.towertail.TowertailTests
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Towertail.app/Contents/MacOS/Towertail
