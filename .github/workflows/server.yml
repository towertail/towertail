name: server

on:
  push:
    branches: [main]
    # A server/vX.Y.Z tag publishes the binaries and the image (job "release").
    tags: ['server/v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The required checks must report on every PR, so path filters live
  # here and not in "on:". A skipped job counts as a pass.
  changes:
    name: server / changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run: ${{ github.event_name == 'workflow_dispatch' || github.ref_type == 'tag' || steps.filter.outputs.run == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: filter
        if: github.event_name != 'workflow_dispatch' && github.ref_type != 'tag'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            run:
              - 'server/**'
              - 'scripts/build.server.sh'
              - '.github/workflows/server.yml'

  test:
    name: server / test
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: go vet
        working-directory: server
        run: |
          go vet ./...
          go vet -tags=integration ./...
          go vet -tags=loadtest ./testdata/load
      - name: Unit tests
        working-directory: server
        run: go test ./...
      - name: ClickHouse and Postgres integration tests (testcontainers)
        working-directory: server
        run: go test -tags=integration -timeout=400s ./internal/clickhouse/... ./store/...

  build:
    name: server / build
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Build binary
        run: bash scripts/build.server.sh
      - name: Build image
        run: docker build -f server/docker/Dockerfile -t towertail/server:ci server

  # Not "latest" on GitHub: the Mac updater and /releases/latest must keep the app release.
  release:
    name: server / release
    needs: [test, build]
    if: github.repository == 'towertail/towertail' && startsWith(github.ref, 'refs/tags/server/v')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      packages: write
    env:
      IMAGE: ghcr.io/towertail/server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Version
        id: v
        run: |
          version=${GITHUB_REF_NAME#server/v}
          [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "bad tag: $GITHUB_REF_NAME" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          if [[ $version == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi

      - name: Build binaries
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          mkdir -p out
          for triple in linux-amd64 linux-arm64; do
            bash scripts/build.server.sh "$triple"
            cp "dist/server/$triple/towertail-server" "out/towertail-server-$triple"
          done
          v=$(./out/towertail-server-linux-amd64 --version) && echo "$v"
          [[ $v == *" $VERSION "* ]]
          (cd out && sha256sum towertail-server-* > checksums.txt && cat checksums.txt)

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          # X.Y and latest only for final versions.
          tags: |
            type=raw,value=${{ steps.v.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.v.outputs.version }},enable=${{ steps.v.outputs.prerelease == 'false' }}
            type=raw,value=latest,enable=${{ steps.v.outputs.prerelease == 'false' }}
          labels: |
            org.opencontainers.image.title=towertail-server
            org.opencontainers.image.licenses=AGPL-3.0
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: server
          file: server/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.v.outputs.version }}
            SHA=${{ steps.v.outputs.sha }}

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
          PRERELEASE: ${{ steps.v.outputs.prerelease }}
        run: |
          flags=(--latest=false --title "Server $VERSION" --generate-notes --verify-tag)
          [ "$PRERELEASE" = true ] && flags+=(--prerelease)
          prev=$(git tag -l 'server/v*' --sort=-v:refname | grep -vxF "$GITHUB_REF_NAME" | head -1 || true)
          [ -n "$prev" ] && flags+=(--notes-start-tag "$prev")
          gh release create "$GITHUB_REF_NAME" out/* --repo "$GITHUB_REPOSITORY" "${flags[@]}"
