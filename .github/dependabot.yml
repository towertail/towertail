version: 2
updates:
  - package-ecosystem: gomod
    directory: /server
    schedule:
      interval: weekly
    groups:
      minor-patch:
        update-types: [minor, patch]
  # Change to /apps/windows after the layout move.
  - package-ecosystem: nuget
    directory: /app/windows
    schedule:
      interval: weekly
    groups:
      minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-patch:
        update-types: [minor, patch]
