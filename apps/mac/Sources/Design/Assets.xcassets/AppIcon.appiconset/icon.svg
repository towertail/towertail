  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1C2230"/><stop offset="1" stop-color="#2A3344"/></linearGradient>
    <linearGradient id="tileGloss" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="0.4" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="180" fill="url(#tile)"/>
  <rect x="100" y="100" width="824" height="824" rx="180" fill="url(#tileGloss)"/>
  <g transform="translate(512 512) scale(1.6) translate(-256 -256)"><g fill="none" stroke="#FFFFFF" stroke-width="22"><rect x="130" y="96" width="252" height="92" rx="24"/><rect x="130" y="226" width="252" height="92" rx="24"/></g><circle cx="178" cy="142" r="14" fill="#34C759"/><circle cx="178" cy="272" r="14" fill="#34C759"/><rect x="214" y="135" width="120" height="14" rx="7" fill="#FFFFFF" opacity="0.35"/><rect x="214" y="265" width="96" height="14" rx="7" fill="#FFFFFF" opacity="0.35"/><path d="M118 382 H196 L224 344 L258 416 L288 364 L306 382 H394" fill="none" stroke="#34C759" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/></g>
